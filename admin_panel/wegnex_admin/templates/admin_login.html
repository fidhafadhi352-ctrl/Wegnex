<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WEGNEX | Admin Login</title>

    <!-- Google Font - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #080808;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            height: 18px;
            background: #1c1c1c;
            width: 100%;
        }

        /* Main Wrapper */
        .login-wrapper {
            min-height: calc(100vh - 18px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        /* Login Card */
        .login-card {
            width: 100%;
            max-width: 368px;
            background: linear-gradient(145deg, #191919, #151515);
            border: 1px solid #2c2c2c;
            border-radius: 3px;
            padding: 29px 27px 28px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        }

        /* Main Title */
        .admin-title {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 7px;
        }

        /* Small Line */
        .title-line {
            width: 22px;
            height: 2px;
            background: #444;
            margin: 0 auto 17px;
        }

        /* Subtitle */
        .admin-subtitle {
            text-align: center;
            font-size: 12px;
            font-weight: 400;
            color: #c7c7c7;
            margin-bottom: 27px;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 18px;
        }

        /* Label */
        .form-label {
            display: block;
            color: #9c9c9c;
            font-size: 11px;
            font-weight: 400;
            margin-bottom: 6px;
        }

        /* Input Wrapper */
        .input-wrapper {
            position: relative;
        }

        /* Input */
        .form-input {
            width: 100%;
            height: 35px;
            background: #242424;
            border: 1px solid #414141;
            border-radius: 3px;
            color: #eeeeee;
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            padding: 0 11px;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: #686868;
            background: #272727;
        }

        .form-input::placeholder {
            color: #777;
        }

        /* Password Input */
        .password-input {
            padding-right: 38px;
        }

        /* Eye Icon */
        .toggle-password {
            position: absolute;
            right: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-password:hover {
            color: #aaa;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            height: 39px;
            margin-top: -1px;
            border: none;
            border-radius: 3px;
            background: #f1f1f1;
            color: #080808;
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
        }

        .login-btn:hover {
            background: #ffffff;
            transform: translateY(-1px);
        }

        .login-btn i {
            font-size: 13px;
        }

        /* Security Text */
        .security-text {
            text-align: center;
            color: #686868;
            font-size: 10px;
            line-height: 1.7;
            margin-top: 23px;
            padding: 0 12px;
        }

        .security-text i {
            font-size: 9px;
            margin-right: 3px;
        }

        /* Footer */
        .footer {
            color: #555;
            font-size: 10px;
            text-align: center;
            margin-top: 26px;
        }

        /* Mobile */
        @media (max-width: 480px) {

            .login-card {
                max-width: 100%;
                padding: 25px 20px;
            }

            .login-wrapper {
                padding: 20px 15px;
            }

        }

    </style>

</head>

<body>

    <!-- Top Bar -->
    <div class="top-bar"></div>

    <!-- Login Wrapper -->
    <div class="login-wrapper">

        <!-- Login Card -->
        <div class="login-card">

            <!-- Title -->
            <h1 class="admin-title">
                WEGNEX ADMIN PORTAL
            </h1>

            <!-- Title Line -->
            <div class="title-line"></div>

            <!-- Subtitle -->
            <p class="admin-subtitle">
                Administrator Login
            </p>

            <!-- Messages -->
            {% if messages %}
                <div class="messages-container" style="margin-bottom: 18px;">
                    {% for message in messages %}
                        <div class="alert-box" style="padding: 10px 12px; border-radius: 4px; font-size: 11px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; background: {% if message.tags == 'success' %}#0d1f12{% else %}#1f0d0d{% endif %}; border: 1px solid {% if message.tags == 'success' %}#205c2a{% else %}#5c2020{% endif %}; color: {% if message.tags == 'success' %}#7ee88a{% else %}#ff8585{% endif %};">
                            <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% else %}exclamation-triangle-fill{% endif %}"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="{% url 'admin_login' %}">

                {% csrf_token %}


                <!-- Email or Username -->
                <div class="form-group">

                    <label class="form-label">
                        Email Address or Username
                    </label>

                    <input
                        type="text"
                        name="email"
                        class="form-input"
                        placeholder="Enter admin email or username"
                        value="{{ identifier|default:'' }}"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-input password-input"
                            placeholder="Enter your password"
                            required
                        >

                        <!-- Password Eye -->
                        <i
                            class="bi bi-eye-slash toggle-password"
                            id="togglePassword"
                            onclick="togglePassword()">
                        </i>

                    </div>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-btn">

                    <span>
                        Sign In to Dashboard
                    </span>

                    <i class="bi bi-arrow-right"></i>

                </button>

            </form>


            <!-- Security Message -->
            <p class="security-text">

                <i class="bi bi-lock-fill"></i>

                Authorized personnel only. All<br>
                login activity is monitored for<br>
                security and auditing purposes.

            </p>

        </div>


        <!-- Footer -->
        <div class="footer">

            © 2026 Wegnex Luxury Watches. All Rights Reserved.

        </div>

    </div>


    <!-- Password Toggle Script -->
    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("togglePassword");


            if (password.type === "password") {

                password.type = "text";

                icon.classList.remove("bi-eye-slash");
                icon.classList.add("bi-eye");

            }

            else {

                password.type = "password";

                icon.classList.remove("bi-eye");
                icon.classList.add("bi-eye-slash");

            }

        }

    </script>

    <script>
        // Auto-dismiss messages after 5 seconds
        (function () {
            setTimeout(function () {
                var msgList = document.querySelector('.messages-container');
                if (msgList) {
                    msgList.style.transition = 'opacity 0.4s ease';
                    msgList.style.opacity = '0';
                    setTimeout(function () { msgList.remove(); }, 400);
                }
            }, 5000);
        })();
    </script>

</body>

</html>
